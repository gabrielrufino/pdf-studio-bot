name: CD

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actalog/check-ci@main
      - uses: actions/checkout@v4
      - id: package-version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.package-version.outputs.version }}
      - env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CD_TARGET_REPO: ${{ secrets.CD_TARGET_REPO }}
        run: |
          gh workflow run cd.yml --repo "$CD_TARGET_REPO" --ref main

  deploy-website:
    name: Deploy Website
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './website'
      - id: deployment
        uses: actions/deploy-pages@v5
